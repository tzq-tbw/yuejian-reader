\u4EEC\u5728\u8857\u4E0A\u5076\u7136\u76F8\u9047\u3002","encounter","\u9047\u89C1"],["inviting","adj.","\u5438\u5F15\u4EBA\u7684","\u8FD9\u91CC\u5F62\u5BB9\u8857\u9053\u8BA9\u4EBA\u613F\u610F\u505C\u7559\u3002","invite","\u9080\u8BF7"]],paragraphs:[["A city looks different when you move through it on foot. From a car window, a street is a route between two places. At walking speed, the same street becomes a place in its own right.","\u6B65\u884C\u65F6\uFF0C\u4F60\u773C\u4E2D\u7684\u57CE\u5E02\u4F1A\u6709\u6240\u4E0D\u540C\u3002\u4ECE\u8F66\u7A97\u671B\u51FA\u53BB\uFF0C\u8857\u9053\u662F\u8FDE\u63A5\u4E24\u5730\u7684\u8DEF\u7EBF\u3002\u653E\u6162\u811A\u6B65\uFF0C\u540C\u4E00\u6761\u8857\u9053\u672C\u8EAB\u4E5F\u6210\u4E86\u503C\u5F97\u505C\u7559\u7684\u5730\u65B9\u3002","when \u5F15\u5BFC\u65F6\u95F4\u72B6\u8BED\u4ECE\u53E5\uFF1Bin its own right \u8868\u793A\u201C\u51ED\u5176\u81EA\u8EAB\u201D\u3002"],["Urban planners often use the word walkability to describe how easily people can reach the places they need. Yet distance alone tells only part of the story. A short walk along a noisy road may feel longer than a quiet walk through a park.","\u57CE\u5E02\u89C4\u5212\u8005\u5E38\u7528\u201C\u6B65\u884C\u4FBF\u5229\u6027\u201D\u63CF\u8FF0\u4EBA\u4EEC\u6B65\u884C\u5230\u8FBE\u76EE\u7684\u5730\u7684\u96BE\u6613\u7A0B\u5EA6\u3002\u7136\u800C\uFF0C\u8DDD\u79BB\u53EA\u8BF4\u660E\u4E86\u4E00\u90E8\u5206\u60C5\u51B5\u3002\u6CBF\u5608\u6742\u9053\u8DEF\u8D70\u4E00\u5C0F\u6BB5\uFF0C\u53EF\u80FD\u6BD4\u5B89\u9759\u5730\u7A7F\u8FC7\u516C\u56ED\u66F4\u8BA9\u4EBA\u89C9\u5F97\u6F2B\u957F\u3002","\u9996\u53E5\u4E3B\u5E72\u662F Urban planners use the word walkability\uFF1Bto describe \u8868\u793A\u76EE\u7684\uFF0Chow easily \u5F15\u51FA describe \u7684\u5BBE\u8BED\u3002"],["Small details can change that experience. A bench in the shade offers a reason to pause. A shop with an open door makes a corner feel more inviting. Together, these details turn an ordinary journey into a series of
