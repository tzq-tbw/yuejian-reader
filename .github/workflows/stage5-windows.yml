name: Validate Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      sha256:
        description: Expected installer SHA256
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download, install and test on Windows
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid SHA256' }
          $name = "Yuejian-$env:VERSION-x64-setup.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION"
          Invoke-WebRequest "$base/$name" -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $env:EXPECTED_SHA) {
            throw 'Installer hash mismatch'
          }
          ./scripts/verify-installed-windows.ps1 -Installer $installer
